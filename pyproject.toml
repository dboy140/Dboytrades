[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ictkb"
version = "0.1.0"
description = "Citable knowledge base and rule distiller for ICT / NBBTRADER YouTube content"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.scripts]
ictkb = "ictkb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
