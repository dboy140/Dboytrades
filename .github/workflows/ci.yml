name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Tests
        run: python -m pytest -q

      - name: Provenance gate
        # Fails the build if any claim cites a segment that is not in the
        # corpus, any quote is not verbatim, or any rule cannot be traced to a
        # claim. Runs without --strict-empty because the corpus is not
        # committed; add that flag once ingestion is wired into CI.
        run: python -m ictkb validate
