# Search vocabulary used to mine the transcript corpus.
#
# This is a list of TERMS TO SEARCH FOR, not a set of assertions about what
# any creator teaches. Nothing here is a claim and nothing here is citable.
# Its only job is to give `ictkb mine` a starting set of queries so that
# concept-bearing segments surface for human review. Claims are created only
# from segments that actually come back from the corpus.

concepts:
  market_structure:
    aliases: ["market structure", "break of structure", "BOS", "change of character",
              "CHOCH", "swing high", "swing low", "higher high", "lower low",
              "market structure shift", "MSS"]
  liquidity:
    aliases: ["liquidity", "buy side liquidity", "sell side liquidity", "BSL", "SSL",
              "liquidity pool", "stop hunt", "liquidity sweep", "liquidity grab",
              "equal highs", "equal lows", "raid"]
  imbalance:
    aliases: ["fair value gap", "FVG", "imbalance", "inefficiency", "BISI", "SIBI",
              "balanced price range", "volume imbalance", "liquidity void"]
  order_block:
    aliases: ["order block", "bullish order block", "bearish order block", "OB",
              "breaker", "breaker block", "mitigation block", "rejection block"]
  premium_discount:
    aliases: ["premium", "discount", "equilibrium", "dealing range", "optimal trade entry",
              "OTE", "fibonacci", "standard deviation projection"]
  time:
    aliases: ["killzone", "kill zone", "London open", "New York open", "Asian range",
              "silver bullet", "power of three", "AMD", "accumulation manipulation distribution",
              "macro", "session", "true day open", "midnight open"]
  narrative:
    aliases: ["draw on liquidity", "daily bias", "higher timeframe bias", "PD array",
              "premium discount array", "institutional order flow", "SMT divergence",
              "interbank price delivery"]
  risk:
    aliases: ["stop loss", "risk to reward", "position size", "risk per trade",
              "partial", "break even", "drawdown", "expectancy"]
  execution:
    aliases: ["entry", "confirmation", "model", "setup", "target", "take profit",
              "invalidation", "displacement", "candle close"]

# Rule phases the distiller expects. A trading system is only executable if
# every phase below is populated by at least one accepted rule.
required_phases:
  - bias          # what direction, and why
  - filter        # when NOT to trade (session, news, regime)
  - setup         # the pattern that must form
  - entry         # the precise trigger
  - stop          # where the idea is wrong
  - target        # where the trade is taken off
  - risk          # sizing and exposure limits
