# Source channels for the knowledge base.
#
# VERIFY BEFORE FIRST RUN. This file was authored in an environment with no
# egress to youtube.com or api.apify.com (see docs/BLOCKED.md), so no field
# below has been confirmed against a live service. Channel URLs are recorded
# as handles rather than UC... channel IDs precisely because a wrong channel
# ID would silently ingest the wrong creator's corpus and poison every
# downstream citation. Resolve `channel_id` with `ictkb resolve-sources`
# once egress exists, and commit the resolved values.

sources:
  - key: ICT
    display_name: Inner Circle Trader
    handle: "@InnerCircleTrader"
    url: https://www.youtube.com/@InnerCircleTrader
    channel_id: null        # populate after verification
    verified: false
    notes: >
      Primary methodology source. Large back-catalogue including multi-year
      mentorship series; expect thousands of hours. Prefer the numbered
      mentorship/core-content playlists over one-off livestreams when
      budget-constrained.

  - key: NBBTRADER
    display_name: NBBTRADER
    handle: "@NBBTRADER"
    url: https://www.youtube.com/@NBBTRADER
    channel_id: null        # populate after verification
    verified: false
    notes: >
      Secondary source. The handle above is a best guess and MUST be
      confirmed against the live channel before ingestion; there are several
      similarly-named accounts and picking the wrong one invalidates every
      claim sourced to this key.

# Apify actors. IDs use the tilde form the REST API expects (user~actor-name).
# These are the conventional public actors for the job, but they have NOT been
# confirmed to exist or to emit the field names assumed in src/ictkb/ingest.py.
# Run `ictkb doctor` after unblocking: it probes each actor and reports the
# real output schema rather than assuming one.
actors:
  channel_videos:
    id: "streamers~youtube-scraper"
    verified: false
    # Cost control: this actor bills per video scraped.
    default_input:
      maxResults: 200
      maxResultsShorts: 0
      maxResultStreams: 0

  transcripts:
    id: "pintostudio~youtube-transcript-scraper"
    verified: false
    # Fallback candidates if the primary actor is unavailable or its output
    # shape differs. `ictkb doctor` tries these in order.
    fallbacks:
      - "topaz_sharingan~youtube-transcript-scraper-cheapest"
      - "karamelo~youtube-transcripts"

ingestion:
  # Caption cues are merged into overlapping windows. A window is the unit of
  # citation: every quote in the knowledge base must fall inside one.
  window_seconds: 45
  window_overlap_seconds: 15
  language_preference: ["en", "en-US", "en-GB"]
  # Auto-generated captions are usable but lossy (no punctuation, homophone
  # errors). Claims grounded only in auto-captions are marked lower confidence.
  allow_auto_captions: true
